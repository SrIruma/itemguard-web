name: Feature Request
description: Suggest a new feature or an improvement.
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Got an idea? Describe the problem first, then the solution. For open-ended discussion, use [Discussions](https://github.com/SrIruma/itemguard-web/discussions).

  - type: dropdown
    id: area
    attributes:
      label: What does this touch?
      options:
        - Core plugin
        - Addon API
        - An addon or bridge
        - Documentation
        - Not sure
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do that's awkward or impossible today?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Your idea
      description: What you'd like to see. A rough sketch is fine.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Anything you've tried or considered.
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Extra context
      description: Screenshots, config snippets, links.
    validations:
      required: false
