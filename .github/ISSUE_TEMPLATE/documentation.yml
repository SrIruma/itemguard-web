name: Documentation improvement
description: Suggest new or better documentation.
title: "[Docs] "
labels: ["documentation"]
body:
  - type: markdown
    attributes:
      value: |
        This tracker is for the documentation site. For the plugin itself, use the [main repository](https://github.com/SrIruma/ItemGuard/issues/new/choose).

  - type: input
    id: page
    attributes:
      label: Page or section
      placeholder: "#api-rules"
    validations:
      required: true

  - type: textarea
    id: suggestion
    attributes:
      label: What would you add or change?
    validations:
      required: true
