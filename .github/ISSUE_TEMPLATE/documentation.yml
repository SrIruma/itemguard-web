name: Documentation improvement
description: Suggest new or better documentation on the site.
title: "[Docs] "
labels: ["documentation"]
body:
  - type: input
    id: page
    attributes:
      label: Page or section
      placeholder: "#api-rules"
    validations:
      required: true

  - type: textarea
    id: suggestion
    attributes:
      label: What would you add or change?
    validations:
      required: true
